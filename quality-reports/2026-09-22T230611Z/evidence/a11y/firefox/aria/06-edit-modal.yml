- banner:
  - img "BuggyBoard"
  - heading "BuggyBoard" [level=1]
  - search:
    - textbox "Search bugs by title":
      - /placeholder: Search bugs…
      - text: "[a11y] walk firefox 1790118844346"
    - button "Clear search"
  - button "New Bug"
  - button "Logout"
- main:
  - group "Filter by bug state":
    - button "Open" [pressed]
    - button "Closed"
  - status: 1 open bug shown.
  - region "Bug table":
    - table "Bugs":
      - rowgroup:
        - row "ID Severity Title Owner":
          - columnheader "ID":
            - button "ID"
          - columnheader "Severity":
            - button "Severity"
          - columnheader "Title":
            - button "Title"
          - columnheader "Owner":
            - button "Owner"
      - rowgroup:
        - row "7015 MID [a11y] walk firefox 1790118844346 buggy":
          - cell "7015"
          - cell "MID"
          - cell "[a11y] walk firefox 1790118844346":
            - button "[a11y] walk firefox 1790118844346"
          - cell "buggy"
- 'dialog "Edit bug #7015"':
  - 'heading "Edit bug #7015" [level=2]'
  - button "Close"
  - text: ID
  - textbox "ID": "7015"
  - text: Title
  - textbox "Title": "[a11y] walk firefox 1790118844346"
  - text: Severity
  - combobox "Severity":
    - option "HIGH"
    - option "MID" [selected]
    - option "LOW"
  - text: State
  - combobox "State":
    - option "Open" [selected]
    - option "Closed"
  - text: Owner
  - textbox "Owner": buggy
  - text: Description
  - textbox "Description": Created by a11y keyboard walk
  - button "Delete"
  - button "Cancel"
  - button "Save" [disabled]